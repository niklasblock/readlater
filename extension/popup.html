<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 13px;
        }
        h2 {
            font-size: 14px;
            font-weight: 500;
            margin: 0 0 12px 0;
        }
        input, textarea {
            width: 100%;
            padding: 6px 8px;
            border: 0.5px solid #d0d0d0;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 8px;
            box-sizing: border-box;
        }
        label {
            font-size: 11px;
            color: #666;
            display: block;
            margin-bottom: 3px;
        }
        button {
            width: 100%;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px;
            font-size: 13px;
            cursor: pointer;
        }
        #status {
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
        }
        .success { color: #3b6d11; }
        .error { color: #a32d2d; }
    </style>
</head>
<body>
    <h2>Read Later speichern</h2>

    <label>Tags (kommagetrennt)</label>
    <input type="text" id="tags" placeholder="python, api, tutorial">

    <label>Notiz</label>
    <textarea id="note" rows="2" placeholder="Optionale Notiz..."></textarea>

    <button id="save-btn">Speichern</button>
    <div id="status"></div>

    <script src="popup.js"></script>
</body>
</html>
