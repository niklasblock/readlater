<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 320px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #ffffff;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 0.5px solid #e0e0e0;
        }
        .header h2 {
            font-size: 14px;
            font-weight: 500;
            color: #1a1a1a;
        }
        .url-preview {
            font-size: 11px;
            color: #666;
            margin-bottom: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        label {
            font-size: 11px;
            color: #666;
            display: block;
            margin-bottom: 3px;
        }
        input, textarea {
            width: 100%;
            padding: 6px 8px;
            border: 0.5px solid #d0d0d0;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 8px;
            color: #1a1a1a;
            background: #f5f5f5;
            font-family: inherit;
        }
        textarea { resize: none; }
        button {
            width: 100%;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 4px;
        }
        button:hover { background: #333; }
        #status {
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
            min-height: 16px;
        }
        .success { color: #3b6d11; }
        .error { color: #a32d2d; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Read Later</h2>
    </div>
    <div class="url-preview" id="url-preview">Lädt...</div>

    <label>Tags (kommagetrennt)</label>
    <input type="text" id="tags" placeholder="python, api, tutorial">

    <label>Notiz</label>
    <textarea id="note" rows="2" placeholder="Optionale Notiz..."></textarea>

    <button id="save-btn">Speichern</button>
    <div id="status"></div>

    <script src="popup.js"></script>
</body>
</html>
