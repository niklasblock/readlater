[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readlater"
version = "0.1.0"
description = "A read later tool with browser extension and local API"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "httpx",
    "beautifulsoup4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*"]