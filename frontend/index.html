<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Read Later</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!--Hauptseite-->
    <div>
        <h1>Read Later</h1>
        <div style="display:flex; gap:8px; margin-bottom:1rem; align-items:center;">
            <div>
                <label for="tag-filter">Tag filtern:</label>
                <input type="text" id="tag-filter" placeholder="z.B. python">
            </div>
            <div>
                <label for="read-filter">Status:</label>
                <select id="read-filter">
                    <option value="">Alle</option>
                    <option value="unread">Ungelesen</option>
                    <option value="read">Gelesen</option>
                </select>
            </div>
        </div>
    
        <table id="readlater-table" class="table">
            <thead>
                <tr>
                    <th>Datum</th>
                    <th>Titel / URL</th>
                    <th>Tags</th>
                    <th>Notiz</th>
                    <th>Gelesen</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="readlater-body"></tbody>
        </table>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
